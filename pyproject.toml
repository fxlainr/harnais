[project]
name = "harnais"
version = "0.1.0"
description = "Mémoire locale et boussole d'intentions pour un usage maîtrisé de l'IA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "mcp>=2.3.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
harnais = "harnais.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnais"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
